[project]
name = "rebind"
version = "0.2.0"
description = "Accessible PDF reconstruction for damaged library scans"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Scharff" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "weasyprint>=62",
    "pikepdf>=9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pdfminer.six>=20240706",
    "rapidocr-onnxruntime>=1.4",
    "pypdfium2>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "pyinstaller>=6.10",
]

[project.scripts]
rebind = "rebind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m \"not packaging\""
# Puts the repo root on sys.path so tests can `from tests.fixtures import ...`. Without this,
# pytest's default "prepend" import mode adds only `tests/` itself, and `import tests.fixtures`
# fails with "No module named 'tests'" -- verified, not assumed. Phase 1 shares a fixture
# generator across several test modules, so the shared import has to resolve.
pythonpath = ["."]
markers = [
    "packaging: slow, opt-in tests that build the frozen PyInstaller bundle and exercise it. Run with `uv run pytest -m packaging`.",
    "slow: long-running tests (e.g. the 300-page document). Included by default; deselect with `-m 'not slow'`.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
